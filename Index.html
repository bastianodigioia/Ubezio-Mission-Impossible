<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Impossible Maestro Ubezio</title>
<style>
  :root{--bg:#141210;--paper:#e8dcc4;--ink:#2a2118;--red:#a8281f;--dim:#8a7d66}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;font-family:"Courier New",Courier,monospace;color:var(--ink)}
  .dossier{background:var(--paper);max-width:420px;width:100%;padding:28px 26px 30px;box-shadow:0 30px 60px rgba(0,0,0,.6);position:relative;transform:rotate(-1deg)}
  .stamp{position:absolute;top:14px;right:16px;border:3px solid var(--red);color:var(--red);padding:4px 10px;font-weight:700;letter-spacing:.08em;transform:rotate(8deg);font-size:14px}
  h1{font-size:22px;margin:30px 0 6px;font-weight:700}
  p{margin:0 0 14px;line-height:1.5;font-size:15px}
  .meta{color:var(--dim);font-size:13px}
  button{width:100%;margin-top:18px;padding:16px;font:inherit;font-size:17px;font-weight:700;background:var(--red);color:var(--paper);border:0;cursor:pointer;letter-spacing:.04em}
  button:disabled{background:var(--dim);cursor:default}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  #stato{margin-top:14px;font-size:13px;color:var(--dim);min-height:1.4em}
  #testo{margin-top:16px;font-size:14px;line-height:1.6;white-space:pre-line;border-top:1px dashed var(--dim);padding-top:14px;display:none}
  .burnt{animation:burn 3s forwards}
  @keyframes burn{to{filter:brightness(.2) sepia(1);transform:rotate(-1deg) scale(.96);opacity:0}}
  @media (prefers-reduced-motion:reduce){.burnt{animation:none;opacity:.2}}
</style>
</head>
<body>
<div class="dossier" id="dossier">
  <div class="stamp">RISERVATO</div>
  <h1>Dossier: Maestro Ubezio</h1>
  <p class="meta">Oggetto della missione: Varniero Pozzo<br>Livello: Master · Categoria: over 65</p>
  <p>Alza il volume. Il messaggio verrà letto una sola volta.</p>
  <button id="play">Ascolta il messaggio</button>
  <div id="stato"></div>
  <div id="testo"></div>
</div>

<script>
const righe = [
  "Buongiorno, Maestro Ubezio.",
  "Il tuo obiettivo si chiama Varniero Pozzo. Età: over sessantacinque. Categoria: Master.",
  "Punti di forza: esperienza, testardaggine, e una preparazione nelle aperture che risale a quando i motori erano ancora a vapore.",
  "Punti deboli: stiamo ancora indagando.",
  "La tua missione, se decidi di accettarla, è farne il Campione Italiano Master over sessantacinque di scacchi.",
  "Dovrai rimettere in riga il suo repertorio, curare i finali che regala all'avversario da vent'anni, e convincerlo che il caffè della terza ora non è una fase dell'apertura.",
  "Hai a disposizione una scacchiera, un orologio, e una quantità illimitata di pazienza. Quest'ultima, ci dicono, ti servirà tutta.",
  "Come sempre, se tu o un membro della tua squadra dovesse essere catturato in zeitnot, la Federazione negherà ogni coinvolgimento.",
  "Questo messaggio si autodistruggerà tra cinque secondi.",
  "Cinque. Quattro. Tre. Due.",
  "Buona fortuna, Maestro."
];

let ctx, master, stopMusic=false;
const hz = m => 440*Math.pow(2,(m-69)/12);

function osc(type,freq,t0,dur,gain,decay){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(gain,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t0+Math.max(dur,decay));
  o.connect(g).connect(master); o.start(t0); o.stop(t0+Math.max(dur,decay)+0.05);
}
function noise(t0,dur,gain){
  const n=ctx.sampleRate*dur, buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=ctx.createBufferSource(), g=ctx.createGain(); s.buffer=buf; g.gain.value=gain;
  s.connect(g).connect(master); s.start(t0);
}
// Ostinato originale in 5/4, tonalità Sol minore
const q=60/170, bar=5*q;
function scheduleBar(b,t){
  const pat = b%2==0 ? [[43,1.5],[43,1.5],[46,1],[48,1]] : [[43,1.5],[43,1.5],[41,1],[42,1]];
  let tt=t;
  for(const [m,l] of pat){ osc("sawtooth",hz(m),tt,l*q*0.9,0.18,0.25); osc("square",hz(m-12),tt,l*q*0.9,0.07,0.25); tt+=l*q; }
  for(let k=0;k<10;k++) noise(t+k*q/2,0.03,0.08);
  if(b%2==0){ const ch = b%4==0?[58,62,65]:[55,58,63]; for(const off of [3*q,3.5*q]) for(const m of ch) osc("sawtooth",hz(m),t+off,0.5*q,0.06,0.4); }
  if(b%8==4) for(const m of [67,70,74]) osc("sawtooth",hz(m),t+4*q,2*q,0.07,0.8);
  if(b%8==0 && b>0){ let l=[[70,1],[72,1],[74,3],[0,5],[73,1],[72,1],[70,3]], tl=t; for(const [m,d] of l){ if(m) osc("square",hz(m),tl,d*q*0.95,0.07,0.6); tl+=d*q; } }
}
function startMusic(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=0.7; master.connect(ctx.destination);
  let b=0, next=ctx.currentTime+0.1;
  ctx.resume();
  const tick=()=>{ if(stopMusic) return;
    if(ctx.state!=="running") ctx.resume();
    while(next<ctx.currentTime+1){ scheduleBar(b++,next); next+=bar; }
    setTimeout(tick,200); };
  tick();
}
function selfDestruct(){
  stopMusic=true;
  master.gain.linearRampToValueAtTime(0.1,ctx.currentTime+0.3);
  noise(ctx.currentTime+0.2,3,0.9);
  document.getElementById("dossier").classList.add("burnt");
}

let voceIT=null;
function caricaVoci(){ const vs=speechSynthesis.getVoices(); voceIT = vs.find(v=>v.lang.replace("_","-").toLowerCase().startsWith("it")) || null; return vs.length; }
if("speechSynthesis" in window){ caricaVoci(); speechSynthesis.onvoiceschanged=caricaVoci; }

function parla(testo){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(testo);
    u.lang="it-IT"; u.rate=0.85; u.pitch=0.6; u.volume=0.6;
    if(voceIT) u.voice=voceIT;
    let done=false; const fine=()=>{ if(!done){done=true;res();} };
    u.onend=()=>{ if(ctx) ctx.resume(); fine(); }; u.onerror=e=>{ document.getElementById("stato").textContent="Errore voce: "+(e.error||"sconosciuto"); fine(); };
    setTimeout(fine, 1500+testo.length*120); // sicurezza se onend non arriva
    speechSynthesis.speak(u);
    if(ctx && ctx.state!=="running") ctx.resume();
  });
}
const pausa = ms => new Promise(r=>setTimeout(r,ms));

document.getElementById("play").onclick = async e=>{
  e.target.disabled=true;
  const st=document.getElementById("stato"), tx=document.getElementById("testo");
  if(!("speechSynthesis" in window)){ st.textContent="Questo browser non ha la sintesi vocale. Prova con Chrome o Safari."; return; }
  // Sblocco audio dentro il gesto dell'utente (necessario su iPhone/Android)
  startMusic();
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  caricaVoci();
  st.textContent = voceIT ? "Voce: "+voceIT.name : "Nessuna voce italiana installata: uso la voce predefinita.";
  tx.style.display="block";
  await pausa(2500);
  for(let i=0;i<righe.length;i++){
    tx.textContent += righe[i]+"\n";
    if(i===righe.length-1){ selfDestruct(); await pausa(1500); }
    await parla(righe[i]);
    await pausa(i===8?400:700);
  }
  st.textContent="Messaggio distrutto.";
};
</script>
</body>
</html>
